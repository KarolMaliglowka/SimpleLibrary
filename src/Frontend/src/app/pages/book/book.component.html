<p-table
    #dt
    [value]="books"
    [rows]="10"
    [columns]="cols"

    [globalFilterFields]="['name', 'description']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedBooks"

    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"

>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage books</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="dt.filterGlobal($event.target, 'contains')" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="min-width:14rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name" />
                </div>
            </th>

            <th pSortableColumn="pagesCount" style="min-width:5rem">
                <div class="flex items-center gap-2">
                    Pages count
                    <p-sortIcon field="pagesCount" />
                </div>
            </th>
            <th pSortableColumn="rating" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Reviews
                    <p-sortIcon field="rating" />
                </div>
            </th>
            <th pSortableColumn="inventoryStatus" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Status
                    <p-sortIcon field="inventoryStatus" />
                </div>
            </th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-book>
        <tr>
<!--            <td style="width: 3rem">-->
<!--                <p-tableCheckbox [value]="book" />-->
<!--            </td>-->
<!--            <td style="min-width: 12rem">{{ book.description }}</td>-->
            <td style="min-width: 14rem" [title]="book.description">{{ book.name }}</td>
            <td style="min-width: 5rem">{{ book.pagesCount }}</td>
            <td style="min-width: 5rem">{{ book.publisher }}</td>
            <td style="min-width: 5rem">{{ book.isBorrowed }}</td>

            <td>
<!--                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editBook(book)" />-->
<!--                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteBook(book)" />-->
            </td>
        </tr>
    </ng-template>
</p-table>
