<div class="card">

<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>

<p-table
    #dt
    [value]="books"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['name', 'description']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selectedBooks"
    [responsiveLayout]="'scroll'"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    >
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage books</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="min-width:14rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name" />
                </div>
            </th>

            <th pSortableColumn="pagesCount" style="min-width:5rem">
                <div class="flex items-center gap-2">
                    Pages count
                    <p-sortIcon field="pagesCount" />
                </div>
            </th>
            <th pSortableColumn="authors.surname" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Authors
                    <p-sortIcon field="authors" />
                </div>
            </th>
            <th pSortableColumn="category.name" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Category
                    <p-sortIcon field="category.name" />
                </div>
            </th>
            <th pSortableColumn="publisher.name" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Publisher
                    <p-sortIcon field="publisher" />
                </div>
            </th>
            <th style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Borrowed
                </div>
            </th>
            <th style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-book>
        <tr>
            <td style="min-width: 14rem" [title]="book.description">{{ book.name }}</td>
            <td style="min-width: 5rem">{{ book.pagesCount }}</td>
            <td style="min-width: 5rem">{{ book.authors | namesList }}</td>
            <td style="min-width: 5rem">{{ book.category.name }}</td>
            <td style="min-width: 5rem">{{ book.publisher.name }}</td>
            <td style="min-width: 5rem">{{ book.isBorrowed }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editBook(book)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteBook(book)" />
            </td>
        </tr>
    </ng-template>
</p-table>
<p-dialog [(visible)]="bookDialog" [style]="{ width: '450px' }" header="Book Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">
            <div>
                <label for="name" class="block font-bold mb-3">Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="book.name" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !book.name">Name is required.</small>
            </div>
            <div>
                <label for="description" class="block font-bold mb-3">Description</label>
                <textarea id="description" pTextarea [(ngModel)]="book.description" required rows="3" cols="20" fluid></textarea>
            </div>

<!--            <div>-->

<!--                    <div class="flex items-center gap-2 col-span-6">-->

<!--                        <label for="category1">Accessories</label>-->
<!--                    </div>-->
<!--                    <div class="flex items-center gap-2 col-span-6">-->
<!--                        <p-radiobutton id="category2" name="category" value="Clothing" [(ngModel)]="product.category" />-->
<!--                        <label for="category2">Clothing</label>-->
<!--                    </div>-->
<!--                    <div class="flex items-center gap-2 col-span-6">-->
<!--                        <p-radiobutton id="category3" name="category" value="Electronics" [(ngModel)]="product.category" />-->
<!--                        <label for="category3">Electronics</label>-->
<!--                    </div>-->
<!--                    <div class="flex items-center gap-2 col-span-6">-->
<!--                        <p-radiobutton id="category4" name="category" value="Fitness" [(ngModel)]="product.category" />-->
<!--                        <label for="category4">Fitness</label>-->
<!--                    </div>-->
<!--                </div>-->

            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-6">
                    <label for="book.pagesCount" class="block font-bold mb-3">Pages count</label>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />

    </ng-template>
