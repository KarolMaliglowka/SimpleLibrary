<div class="card">
    <p-toast/>
    <h2>Books to borrow</h2>

    <p-toolbar class="m-1">
        <ng-template #start>
            <div class="flex justify-left">
                <p-toggleswitch
                    [(ngModel)]="checked"
                    [ngModelOptions]="{standalone: true}"
                    (onChange)="loadData(checked)">
                </p-toggleswitch>
                <div style="padding-left: 5px; padding-top: 2px;"> Show with not available</div>
            </div>
        </ng-template>
    </p-toolbar>

<p-table
    #dt
    [value]="books"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['name', 'description', 'code']"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    showGridlines="true"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage books to borrow</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search"/>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                       placeholder="Search..."/>
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="width:30rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name"/>
                </div>
            </th>
            <th pSortableColumn="authors.surname" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Authors
                    <p-sortIcon field="authors"/>
                </div>
            </th>
            <th pSortableColumn="category.name" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Category
                    <p-sortIcon field="category.name"/>
                </div>
            </th>
            <th pSortableColumn="code" style="width:5rem">
                <div class="flex items-center gap-2">
                    Code
                </div>
            </th>
            <th style="width: 5rem">
                <div class="flex items-center gap-2">
                    Available
                </div>
            </th>
            <th style="width: 3rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-book>
        <tr>
            <td style="min-width: 14rem; font-weight: bold" pTooltip="{{book.description}}" tooltipPosition="right">{{ book.name }}</td>
            <td style="min-width: 5rem">{{ book.authors | namesList }}</td>
            <td style="min-width: 5rem">{{ book.category.name }}</td>
            <td style="min-width: 5rem">{{ book.code }}</td>
            <td style="width: 5rem; text-align: center;">
                <i *ngIf="book.isAvailable" class="pi pi-check text-green-500"></i>
                <i *ngIf="!book.isAvailable" class="pi pi-times text-red-500"></i>
            </td>
            <td>
                <p-button
                    #buttonBorrow
                    *ngIf="book.isAvailable"
                    icon="pi pi-book"
                    pTooltip="Borrow"
                    severity="info"
                    tooltipPosition="top"
                    class="mr-2"
                    [rounded]="true"
                    [outlined]="true"
                    (click)="bookToBorrow(book)"
                />
                <p-button
                    #buttonBorrow
                    *ngIf="!book.isAvailable"
                    icon="pi pi-book"
                    pTooltip="Book is borrowed"
                    severity="secondary"
                    tooltipPosition="top"
                    class="mr-2"
                    [rounded]="true"
                    [outlined]="true"
                    [disabled]="true"
                />
            </td>
        </tr>
        <ng-template #tooltipContent>
            <div class="flex items-center" style="width: 100em; z-index: 999999999;">
                <span> {{ book.description }}</span>
            </div>
        </ng-template>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="7">No books to borrow to show</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="bookToBorrowDialog" [modal]="true">
    <form *ngIf="borrowForm" [formGroup]="borrowForm" (ngSubmit)="saveBorrow()">
        <label class="block font-bold" style="font-size: xx-large">
            {{ book?.name }}
        </label>
        <label class="block mt-3" style="font-size: large">
            {{ book?.authors?.length === 1 ? 'Author' : 'Authors' }}:
            <span class="font-bold">{{ getAuthorsNames(book) }}</span>
        </label>
        <label class="block mt-3" style="font-size: large">
            Code: <span class="font-bold">{{ book?.code }}</span>
        </label>
        <div>
            <label for="name" class="block font-bold mt-3">User</label>
            <p-select
                [options]="users"
                formControlName="user"
                [filter]="true"
                appendTo="body"
                optionLabel="name"
                optionValue="id"
                filterBy="name"
                [showClear]="true"
                placeholder="Select user"
                class="w-full">
                <ng-template #selectedItem let-selectedOption>
                    <div class="flex items-center gap-2">
                        <div>{{ selectedOption.name }}</div>
                    </div>
                </ng-template>
                <ng-template let-user #item>
                    <div class="flex items-center gap-2">
                        <div>{{ user.name }}</div>
                    </div>
                </ng-template>
            </p-select>

        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()"/>
        <p-button label="Save" icon="pi pi-check" (click)="saveBorrow()"/>
    </ng-template>
</p-dialog>

<p-confirmDialog [style]="{ width: '450px' }"/>
