<div class="card flex justify-left">
    <p-toggleswitch [(ngModel)]="checked" (onChange)="loadData(checked)"/>
    <div style="padding-left: 5px;"> Show with not available</div>
</div>

<p-table
    #dt
    [value]="books"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['name', 'description']"
    dataKey="id"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    showGridlines="true"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage books</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search"/>
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                       placeholder="Search..."/>
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="width:30rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name"/>
                </div>
            </th>
            <th pSortableColumn="authors.surname" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Authors
                    <p-sortIcon field="authors"/>
                </div>
            </th>
            <th pSortableColumn="category.name" style="min-width: 12rem">
                <div class="flex items-center gap-2">
                    Category
                    <p-sortIcon field="category.name"/>
                </div>
            </th>
            <th style="width: 5rem">
                <div class="flex items-center gap-2">
                    Available
                </div>
            </th>
            <th style="width: 4rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-book>
        <tr>
            <td style="min-width: 14rem" pTooltip="{{book.description}}">{{ book.name }}</td>
            <td style="min-width: 5rem">{{ book.authors | namesList }}</td>
            <td style="min-width: 5rem">{{ book.category.name }}</td>
            <td style="width: 5rem; text-align: center;">
                <i *ngIf="book.isAvailable" class="pi pi-check text-green-500"></i>
                <i *ngIf="!book.isAvailable" class="pi pi-times text-red-500"></i>
            </td>
            <td>
                <p-button
                    #buttonBorrow
                    *ngIf="book.isAvailable"
                    icon="pi pi-book"
                    pTooltip="Borrow"
                    severity="info"
                    tooltipPosition="top"
                    class="mr-2"
                    [rounded]="true"
                    [outlined]="true"
                    (click)="hideDialog()"
                />
                <p-button
                    #buttonBorrow
                    *ngIf="!book.isAvailable"
                    icon="pi pi-book"
                    pTooltip="Book is borrowed"
                    severity="secondary"
                    tooltipPosition="top"
                    class="mr-2"
                    [rounded]="true"
                    [outlined]="true"
                    [disabled]="true"
                />
            </td>
        </tr>
    </ng-template>
</p-table>
