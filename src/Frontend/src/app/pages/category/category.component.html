<p-toolbar class="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>
<p-table
    #dt
    [value]="categories"
>

    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage categories</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="min-width:14rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name" />
                </div>
            </th>
            <th style="width: 12rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body>
        <tr>
            <td style="min-width: 14rem">{{ category.name }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editCategory(category)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteCategory(category)" />
            </td>
        </tr>
    </ng-template>
</p-table>
