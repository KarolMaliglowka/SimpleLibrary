<p-toast />
<p-toolbar class="m-1">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()"></p-button>
    </ng-template>
</p-toolbar>

<p-table #dt
         [value]="categories"
         [paginator]="true"
         [rows]="10"
         showGridlines="true"
         [globalFilterFields]="['name']">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage categories</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search"/>
                <input pInputText type="text"
                       (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                       placeholder="Search..."/>
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="min-width:14rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name"/>
                </div>
            </th>
            <th style="width: 8rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>

    <ng-template #body let-category>
        <tr>
            <td>{{ category.name }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                          (click)="editCategory(category)"></p-button>
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                          (click)="deleteCategory(category)"></p-button>
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="categoryDialog" header="Category Details" [modal]="true">
    <form *ngIf="categoryForm" [formGroup]="categoryForm" (ngSubmit)="saveCategory()">
        <div class="flex flex-col gap-4">
            <div>
                <label for="name" class="block font-bold mb-2">Name</label>
                <input pInputText id="name" formControlName="name" required autofocus class="w-full p-inputtext-sm"/>
                <small class="text-red-500"
                       *ngIf="categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched">
                    Name is required.
                </small>
            </div>
        </div>
    </form>
    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (onClick)="categoryDialog=false"></p-button>
        <p-button type="submit" label="Save" [disabled]="categoryForm.invalid" (onClick)="saveCategory()"></p-button>
    </ng-template>
</p-dialog>
