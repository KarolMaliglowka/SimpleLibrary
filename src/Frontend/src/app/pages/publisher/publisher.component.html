<div class="card">
<p-toolbar class="m-1">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" class="mr-2" (onClick)="openNew()" />
    </ng-template>
</p-toolbar>
<p-table
    #dt
    [value]="publishers"
    [paginator]="true"
    [rows]="10"
    [globalFilterFields]="['name']"
    [tableStyle]="{ 'min-width': '75rem' }"
    showGridlines=true
>

    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">Manage publishers</h5>
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th pSortableColumn="name" style="min-width:14rem">
                <div class="flex items-center gap-2">
                    Name
                    <p-sortIcon field="name" />
                </div>
            </th>
            <th style="width: 8rem">
                <div class="flex items-center gap-2">
                    Action
                </div>
            </th>
        </tr>
    </ng-template>
    <ng-template #body let-publisher>
        <tr>
            <td style="min-width: 14rem">{{ publisher.name }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editPublisher(publisher)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deletePublisher(publisher)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<p-dialog [(visible)]="publisherDialog" header="Publisher details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">
            <div>
                <label for="name" class="block font-bold mb-3">Name</label>
                <input type="text" pInputText id="name" [(ngModel)]="publisher.name" required autofocus fluid/>
                <small class="text-red-500" *ngIf="submitted && !publisher.name">Name is required.</small>
            </div>
        </div>
    </ng-template>

    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()"/>
        <p-button label="Save" icon="pi pi-check" (click)="savePublisher()"/>
    </ng-template>
</p-dialog>
</div>
